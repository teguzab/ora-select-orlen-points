name: Aktualizacja punktów Orlen Paczka

on:
  schedule:
    - cron: "15 3 * * *" # codziennie ok. 5:15 czasu polskiego
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz punkty
        run: python fetch_points.py orlen-points.json
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          # porównujemy bez pola "updated", żeby nie commitować codziennie tego samego
          python - <<'PY'
          import json, subprocess
          old = subprocess.run(["git", "show", "HEAD:orlen-points.json"], capture_output=True, text=True).stdout
          new = open("orlen-points.json", encoding="utf-8").read()
          strip = lambda s: {k: v for k, v in json.loads(s).items() if k != "updated"} if s else None
          open(".unchanged", "w").write("1" if old and strip(old) == strip(new) else "0")
          PY
          if [ "$(cat .unchanged)" = "1" ]; then rm .unchanged; git checkout -- orlen-points.json; echo "Brak zmian"; exit 0; fi
          rm .unchanged
          git add orlen-points.json
          git commit -m "Aktualizacja punktów Orlen Paczka $(date -u +%F)"
          git push
      - name: Wyczyść cache jsDelivr
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/orlen-points.json" || true
